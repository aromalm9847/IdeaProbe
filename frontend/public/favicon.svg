<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="ip-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="ip-bulb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="32" height="32" rx="8" fill="url(#ip-bg)"/>

  <!-- Soft glow behind bulb (no filter — avoids rendering bugs) -->
  <circle cx="16" cy="13" r="8" fill="#6366f1" opacity="0.25"/>

  <!-- Bulb glass body -->
  <path d="M11.5 14.5c0-2.5 2-4.5 4.5-4.5s4.5 2 4.5 4.5c0 1.5-0.8 2.8-1.8 3.8H13.3c-1-1-1.8-2.3-1.8-3.8z" fill="url(#ip-bulb)"/>

  <!-- Bulb base / neck -->
  <rect x="13.3" y="18.3" width="5.4" height="1.2" rx="0.4" fill="#f59e0b"/>
  <rect x="13.6" y="19.5" width="4.8" height="1.1" rx="0.4" fill="#d97706"/>
  <rect x="13.3" y="20.6" width="5.4" height="0.8" rx="0.3" fill="#b45309"/>

  <!-- Filament line inside bulb -->
  <line x1="14" y1="17.5" x2="18" y2="17.5" stroke="#fef3c7" stroke-width="0.6" stroke-linecap="round"/>

  <!-- Sparkle top-right -->
  <g fill="#a5b4fc">
    <circle cx="22" cy="7" r="0.9"/>
    <circle cx="24" cy="10" r="0.6"/>
    <circle cx="21" cy="5" r="0.5"/>
  </g>

  <!-- Sparkle top-left -->
  <g fill="#fde68a">
    <circle cx="10" cy="7" r="0.7"/>
    <circle cx="8" cy="10" r="0.5"/>
  </g>
</svg>
